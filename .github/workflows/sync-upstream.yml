name: Sync upstream main

on:
  schedule:
    # Daily at 10:17 Asia/Shanghai (02:17 UTC)
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add upstream and fetch main
        run: |
          git remote add upstream https://github.com/vxcontrol/pentagi.git
          git fetch upstream main

      - name: Merge upstream main into fork
        run: |
          git switch main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin main
